name: build-windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # required for action-gh-release to upload assets

# Skip macOS-style code-signing on Windows runners (no cert anyway). Set at
# workflow level so every step inherits these defaults.
env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  ELECTRON_BUILDER_DISABLE_CODE_SIGNING: 'true'
  # Force npm/yarn to use a writable cache on the runner
  npm_config_cache: ${{ github.workspace }}\.npm-cache

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate release tag and package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $expectedTag = "v$packageVersion"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            Write-Error "Release tag '$env:GITHUB_REF_NAME' is invalid. Use exact clean tag '$expectedTag' so older NEO-LIB installs can detect the update."
            exit 1
          }
          Write-Host "Release tag $expectedTag matches package version and the legacy update contract."

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # NOTE: caching intentionally disabled — works whether or not yarn.lock is present

      - name: Show tool versions
        run: |
          node --version
          yarn --version
          npx --version
        shell: pwsh

      - name: Install deps
        # Falls back gracefully if yarn.lock is missing on the runner.
        # `--network-timeout` avoids flaky network failures killing the build.
        run: |
          if (Test-Path yarn.lock) {
            yarn install --frozen-lockfile --network-timeout 600000
          } else {
            Write-Host "No yarn.lock found - running fresh install"
            yarn install --network-timeout 600000
          }
        shell: pwsh

      - name: Build renderer (Vite)
        # Bake the feedback-relay URL + signing key (never the raw Discord
        # webhook — see cloudflare-relay/README.md) into the renderer build
        # via a generated .env, so the compiled .exe's feedback button
        # actually works instead of showing "not configured".
        shell: pwsh
        env:
          NEOLIB_FEEDBACK_RELAY_URL: ${{ secrets.NEOLIB_FEEDBACK_RELAY_URL }}
          NEOLIB_FEEDBACK_RELAY_KEY: ${{ secrets.NEOLIB_FEEDBACK_RELAY_KEY }}
          NEOLIB_DISCORD_APP_ID: ${{ secrets.NEOLIB_DISCORD_APP_ID }}
        run: |
          try {
            node scripts/prepare-release-config.cjs
            if ($LASTEXITCODE -ne 0) { throw "Release configuration failed with exit code $LASTEXITCODE." }
            yarn build:renderer
            if ($LASTEXITCODE -ne 0) { throw "Renderer build failed with exit code $LASTEXITCODE." }
          }
          finally {
            node scripts/cleanup-release-config.cjs
            if ($LASTEXITCODE -ne 0) { throw "Release configuration cleanup failed with exit code $LASTEXITCODE." }
          }

      - name: Verify renderer output exists
        run: |
          if (-not (Test-Path dist-renderer\index.html)) {
            Write-Error "dist-renderer/index.html missing - Vite build failed silently"
            exit 1
          }
          Write-Host "Renderer OK"
        shell: pwsh

      - name: Build NSIS installer (verbose)
        # `--publish never` prevents electron-builder from trying to talk to GH releases
        # mid-build (we attach assets via action-gh-release in a later step instead).
        run: npx --no-install electron-builder --win --x64 --publish never
        env:
          DEBUG: electron-builder
          NEOLIB_DISCORD_APP_ID: ${{ secrets.NEOLIB_DISCORD_APP_ID }}

      - name: Build portable folder (verbose)
        run: npx --no-install electron-builder --win --dir --x64 --publish never
        env:
          DEBUG: electron-builder
          NEOLIB_DISCORD_APP_ID: ${{ secrets.NEOLIB_DISCORD_APP_ID }}

      - name: List dist contents (debug)
        run: |
          if (Test-Path dist) {
            Get-ChildItem -Path dist -Recurse -Depth 2 | Select-Object FullName,Length
          } else {
            Write-Error "dist/ does not exist - electron-builder failed earlier"
            exit 1
          }
        shell: pwsh

      - name: Zip portable folder
        run: yarn package:portable

      - name: Inspect release candidate identity and contents
        run: yarn inspect:release
        env:
          NEOLIB_EXPECT_FEEDBACK_RELAY_URL: ${{ secrets.NEOLIB_FEEDBACK_RELAY_URL }}
          NEOLIB_EXPECT_FEEDBACK_RELAY_KEY: ${{ secrets.NEOLIB_FEEDBACK_RELAY_KEY }}
          NEOLIB_EXPECT_DISCORD_APP_ID: ${{ secrets.NEOLIB_DISCORD_APP_ID }}

      # Always upload artifacts (visible on every workflow run, even if a later step fails)
      - name: Upload artifacts (Actions tab)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: NEO-LIB-Windows
          path: |
            desktop-app/dist/*.exe
            desktop-app/dist/NEO-LIB-windows-portable.zip
            desktop-app/dist/release-candidate-v*.json
            desktop-app/dist/SHA256SUMS-v*.txt
          if-no-files-found: warn

      # Attach installer + portable zip directly to the GitHub Release page.
      # Only runs when the workflow was triggered by a tag push (v*).
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop-app/dist/*.exe
            desktop-app/dist/NEO-LIB-windows-portable.zip
            desktop-app/dist/release-candidate-v*.json
            desktop-app/dist/SHA256SUMS-v*.txt
          fail_on_unmatched_files: true
          generate_release_notes: false
          body_path: RELEASE_NOTES_v1.7.7.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
